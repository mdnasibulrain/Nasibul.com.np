      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

          b.subtitle.toLowerCase().includes(q) ||
          b.summary.toLowerCase().includes(q) ||
          (b.highlights && b.highlights.some(h => h.toLowerCase().includes(q)));
        return matchesCategory && matchesSearch;

    function renderCustomBundleBuilder() {
      const container = document.getElementById('custom-bundle-items');
      const summary = document.getElementById('custom-bundle-summary');
      if (!container || !summary) return;

      const { ebooks, storeInfo } = appState;

      container.innerHTML = ebooks.map(b => {
        const isSelected = selectedCustomBundleIds.includes(b.id);
        return `
          <div onclick="toggleCustomBundleSelection('${b.id}')" class="cursor-pointer p-4 rounded-2xl border transition-all ${
            isSelected 
              ? 'bg-brand-50 border-brand-600 text-slate-900 shadow-md ring-2 ring-brand-500/20' 
              : 'bg-paper-50 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-white'
          } flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 truncate">
              <div class="w-6 h-6 rounded-lg ${isSelected ? 'bg-brand-600 text-white' : 'bg-slate-200 text-slate-600'} font-black text-xs flex items-center justify-center shrink-0">
                ${isSelected ? '✓' : '+'}
              </div>
              <div class="truncate">
                <h4 class="text-xs font-bold text-slate-900 truncate">${b.title}</h4>
                <span class="text-[10px] text-slate-500 font-semibold">NPR ${b.salePrice}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Calculate totals
      const selectedBooks = ebooks.filter(b => selectedCustomBundleIds.includes(b.id));
      const rawTotal = selectedBooks.reduce((acc, b) => acc + b.salePrice, 0);
      
      let discountRate = 0;
      if (selectedBooks.length === 2) discountRate = 0.15; // 15% extra
      if (selectedBooks.length >= 3) discountRate = 0.30; // 30% extra

      const finalPrice = Math.round(rawTotal * (1 - discountRate));
      const savedAmount = rawTotal - finalPrice;

      const waMsg = encodeURIComponent(`Hello ${storeInfo.brandName}, I want to purchase my custom Ebook Bundle:\n\n` + 
        selectedBooks.map(b => `• ${b.title}`).join('\n') + 
        `\n\nTotal Books: ${selectedBooks.length}\nCustom Bundle Price: NPR ${finalPrice}`);

      summary.innerHTML = `
        <div>
          <span class="text-xs text-slate-500 font-bold block">Selected: ${selectedBooks.length} Ebooks</span>
          <span class="text-2xl font-black text-slate-900">NPR ${finalPrice} ${rawTotal > finalPrice ? `<span class="text-xs text-slate-400 line-through">NPR ${rawTotal}</span>` : ''}</span>
          ${discountRate > 0 ? `<span class="text-xs font-extrabold text-emerald-700 block mt-0.5">🎉 Extra ${discountRate * 100}% Custom Bundle Discount Applied! (Saved NPR ${savedAmount})</span>` : ''}
        </div>

        <a href="https://wa.me/9779702784684?text=${waMsg}" target="_blank" rel="noopener noreferrer" class="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs sm:text-sm shadow-glow-gold transition-all flex items-center justify-center gap-2 border border-amber-600 ${selectedBooks.length === 0 ? 'opacity-50 pointer-events-none' : ''}">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Order Custom Bundle on WhatsApp</span>
        </a>
      `;
    }

    function toggleCustomBundleSelection(id) {
      if (selectedCustomBundleIds.includes(id)) {
        selectedCustomBundleIds = selectedCustomBundleIds.filter(i => i !== id);
      } else {
        selectedCustomBundleIds.push(id);
      }
      renderCustomBundleBuilder();
    }

                </div>
              </div>

              <!-- Footer Buy Bar -->
              <div class="bg-white px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">

          <div class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
            <aside class="md:col-span-3 bg-white rounded-2xl p-4 border border-slate-200 self-start space-y-2 shadow-sm">
              <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-3 py-1">NAVIGATION</div>
              <nav class="space-y-1">
                <button onclick="switchAdminTab('ebooks')" class="admin-tab-btn w-full text-left px-4 py-3 rounded-xl font-bold text-xs flex items-center gap-3 bg-brand-600 text-white shadow-glow-blue" id="tab-btn-ebooks">
                  <i class="fa-solid fa-book"></i> Catalog Ebooks
                </button>
                <button onclick="switchAdminTab('settings')" class="admin-tab-btn w-full text-left px-4 py-3 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-600 hover:bg-slate-100 hover:text-slate-900" id="tab-btn-settings">
                  <i class="fa-solid fa-sliders"></i> Store Info & Banner
                </button>
                <button onclick="switchAdminTab('security')" class="admin-tab-btn w-full text-left px-4 py-3 rounded-xl font-bold text-xs flex items-center gap-3 text-slate-600 hover:bg-slate-100 hover:text-slate-900" id="tab-btn-security">
                  <i class="fa-solid fa-shield-halved"></i> Update Password
                </button>
              </nav>
            </aside>

            <main class="md:col-span-9 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm" id="admin-panel-content">
              <!-- Rendered via JS -->
            </main>
          </div>
        </div>
      `;

      switchAdminTab('ebooks');
    }

    function renderAdminLogin(container) {
      container.innerHTML = `
        <div class="min-h-screen bg-paper-50 flex items-center justify-center p-4 relative">
          <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-card-hover border border-slate-200 relative z-10">
            <div class="text-center mb-6">
              <div class="w-14 h-14 bg-gradient-to-tr from-brand-600 to-indigo-600 text-white rounded-2xl flex items-center justify-center font-black text-2xl mx-auto mb-3 shadow-glow-blue">
                MN
              </div>
              <h2 class="text-2xl font-black text-slate-900">Admin CMS Portal</h2>
              <p class="text-xs text-slate-500 font-semibold mt-1">MD. NS Ebook Store Management</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Administrator Password</label>
                <input type="password" id="admin-password-input" required placeholder="Enter secret admin password" class="w-full px-4 py-3 rounded-xl bg-paper-50 border border-slate-300 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 font-medium">
              </div>

              <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-black text-sm shadow-glow-blue transition-all">
                Login to Dashboard
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const input = document.getElementById('admin-password-input').value;
      const hashedInput = await hashPassword(input);
      const storedHash = localStorage.getItem('srain_admin_pass_hash') || INITIAL_ADMIN_HASH;

      if (hashedInput === storedHash) {
        isAdminLoggedIn = true;
        sessionStorage.setItem('srain_admin_auth', 'true');
        showToast("🔓 Access Granted", "success");
        handleRouting();
      } else {
        showToast("❌ Invalid Password", "error");
      }
    }

    function handleAdminLogout() {
      isAdminLoggedIn = false;
      sessionStorage.removeItem('srain_admin_auth');
      showToast("🔒 Logged Out", "info");
      handleRouting();
    }

    function switchAdminTab(tabName) {
      document.querySelectorAll('.admin-tab-btn').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white', 'shadow-glow-blue');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-glow-blue');
        activeBtn.classList.remove('text-slate-600');
      }

      const content = document.getElementById('admin-panel-content');
      if (!content) return;

      if (tabName === 'ebooks') {
        content.innerHTML = `
          <div class="space-y-6">
            <div class="border-b border-slate-200 pb-4 flex items-center justify-between">
              <h3 class="text-lg font-black text-slate-900">Manage Catalog Ebooks (${appState.ebooks.length})</h3>
              <button onclick="addNewEbookPrompt()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-black rounded-xl shadow-glow-blue">
                + Add New Ebook
              </button>
            </div>

            <div class="space-y-4">
              ${appState.ebooks.map((b, idx) => `
                <div class="p-4 bg-paper-50 border border-slate-200 rounded-2xl space-y-3">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Title</label>
                      <input type="text" id="eb-title-${idx}" value="${b.title}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-bold text-slate-900">
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Category</label>
                      <select id="eb-cat-${idx}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-semibold text-slate-900">
                        ${appState.categories.filter(c => c.id !== 'ALL').map(c => `
                          <option value="${c.id}" ${b.category === c.id ? 'selected' : ''}>${c.label}</option>
                        `).join('')}
                      </select>
                    </div>
                  </div>

                  <div class="grid grid-cols-3 gap-3">
                    <div>
                      <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Regular Price</label>
                      <input type="number" id="eb-reg-${idx}" value="${b.regularPrice}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs text-slate-900">
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Sale Price</label>
                      <input type="number" id="eb-sale-${idx}" value="${b.salePrice}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-bold text-amber-600">
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Discount %</label>
                      <input type="number" id="eb-disc-${idx}" value="${b.discountPercent}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs text-slate-900">
                    </div>
                  </div>

                  <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Payment / Buy Link</label>
                    <input type="url" id="eb-pay-${idx}" value="${b.payUrl}" class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-xs font-mono text-brand-700">
                  </div>
                </div>
              `).join('')}
            </div>

            <button onclick="saveAdminEbooks()" class="px-6 py-3 bg-gradient-to-r from-brand-600 to-brand-700 text-white text-xs font-black rounded-xl shadow-glow-blue">
              Save All Changes
            </button>
          </div>
        `;
      } else if (tabName === 'settings') {
        content.innerHTML = `
          <form onsubmit="saveStoreSettings(event)" class="space-y-4 max-w-lg">
            <h3 class="text-lg font-black text-slate-900 border-b border-slate-200 pb-3">Store Information</h3>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Brand Name</label>
              <input type="text" id="st-brand" value="${appState.storeInfo.brandName}" required class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 font-medium">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Author Name</label>
              <input type="text" id="st-author" value="${appState.storeInfo.authorName}" required class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 font-medium">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">WhatsApp Support Link</label>
              <input type="text" id="st-wa" value="${appState.storeInfo.supportWhatsapp}" required class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 font-mono">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Top Promo Ticker Text</label>
              <input type="text" id="st-promo" value="${appState.storeInfo.promoText}" required class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 font-medium">
            </div>
            <button type="submit" class="px-6 py-3 bg-brand-600 text-white text-xs font-black rounded-xl shadow-glow-blue">
              Save Settings
            </button>
          </form>
        `;
      } else if (tabName === 'security') {
        content.innerHTML = `
          <form onsubmit="handleChangePassword(event)" class="space-y-4 max-w-sm">
            <h3 class="text-lg font-black text-slate-900 border-b border-slate-200 pb-3">Update CMS Password</h3>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
              <input type="password" id="new-admin-pass" required class="w-full px-3 py-2 rounded-xl bg-white border border-slate-300 text-sm text-slate-900 font-medium">
            </div>
            <button type="submit" class="px-6 py-3 bg-rose-600 text-white text-xs font-black rounded-xl shadow-sm">
              Change Password
            </button>
          </form>
        `;
      }
    }

    function saveAdminEbooks() {
      appState.ebooks.forEach((b, idx) => {
        const titleEl = document.getElementById(`eb-title-${idx}`);
        const catEl = document.getElementById(`eb-cat-${idx}`);
        const regEl = document.getElementById(`eb-reg-${idx}`);
        const saleEl = document.getElementById(`eb-sale-${idx}`);
        const discEl = document.getElementById(`eb-disc-${idx}`);
        const payEl = document.getElementById(`eb-pay-${idx}`);

        if (titleEl) b.title = titleEl.value;
        if (catEl) b.category = catEl.value;
        if (regEl) b.regularPrice = Number(regEl.value);
        if (saleEl) b.salePrice = Number(saleEl.value);
        if (discEl) b.discountPercent = Number(discEl.value);
        if (payEl) b.payUrl = payEl.value;
      });

      saveStore(appState);
    }

    function addNewEbookPrompt() {
      const title = prompt("Enter New Ebook Title:");
      if (!title) return;

      appState.ebooks.unshift({
        id: "eb-" + Date.now(),
        title: title,
        subtitle: "Practical Guide by MD. NS",
        category: "COMPUTER",
        author: appState.storeInfo.authorName,
        regularPrice: 999,
        salePrice: 499,
        discountPercent: 50,
        payUrl: "https://srain.com.np/PAYMENT-LINK",
        summary: "Detailed practical ebook content.",
        highlights: ["Practical Examples", "Step-by-step Guide"]
      });

      saveStore(appState);
      switchAdminTab('ebooks');
    }

    function saveStoreSettings(e) {
      e.preventDefault();
      appState.storeInfo.brandName = document.getElementById('st-brand').value;
      appState.storeInfo.authorName = document.getElementById('st-author').value;
      appState.storeInfo.supportWhatsapp = document.getElementById('st-wa').value;
      appState.storeInfo.promoText = document.getElementById('st-promo').value;

      saveStore(appState);
    }

    async function handleChangePassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('new-admin-pass').value;
      if (newPass.length < 6) {
        showToast("⚠️ Min 6 characters required", "error");
        return;
      }
      const newHash = await hashPassword(newPass);
      localStorage.setItem('srain_admin_pass_hash', newHash);
      showToast("🔑 Password updated successfully!", "success");
      e.target.reset();
    }
  </script>
</body>
</html>
